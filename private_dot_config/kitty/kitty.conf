shell_integration enabled

cursor_trail 1

pixel_scroll yes
momentum_scroll 0.96

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

map kitty_mod+t new_tab_with_cwd
map kitty_mod+enter new_window_with_cwd

map shift+space>w>h neighboring_window left
map shift+space>w>j neighboring_window down
map shift+space>w>k neighboring_window up
map shift+space>w>l neighboring_window right

map shift+space>o>g launch --cwd=current --type=overlay lazygit
map shift+space>o>n launch --cwd=~/Notes/ sh -c 'nvim ~/Notes/journal/$(date +%Y-%m-%d).md'
map shift+space>o>d launch --cwd=~/.local/share/chezmoi/
